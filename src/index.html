<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tunewire</title>
  <link rel="stylesheet" href="styles.css" />
  <style id="theme-css"></style>
  <style id="plugin-css"></style>
  <style id="accent-css"></style>
</head>
<body>
  <div id="ambient" aria-hidden="true"><div class="amb-layer"></div><div class="amb-layer"></div><div class="amb-veil"></div></div>
  <div id="app" class="app">
    <!-- Title bar: window drag area, navigation and search (the window has no system frame). -->
    <header class="titlebar" data-tauri-drag-region>
      <div class="tb-left" data-tauri-drag-region>
        <span class="tb-brand" data-tauri-drag-region aria-label="Tunewire"><span class="tb-logo" aria-hidden="true"></span><span>tune<span class="tb-wire">wire</span></span></span>
        <button class="tb-nav" id="nav-back" title="Go back"><i data-icon="chevLeft"></i></button>
        <button class="tb-nav" id="nav-fwd" title="Go forward"><i data-icon="chevRight"></i></button>
      </div>
      <div class="tb-center" data-tauri-drag-region>
        <button class="tb-home" id="nav-home" title="Home"><i data-icon="home"></i></button>
        <form class="search" id="search-form" autocomplete="off">
          <i data-icon="search"></i>
          <input id="search-input" type="text" placeholder="What do you want to play?" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" />
          <div class="suggest" id="suggest" role="listbox" hidden></div>
          <button type="button" class="search-clear" id="search-clear" title="Clear"><i data-icon="x"></i></button>
          <span class="search-sep" aria-hidden="true"></span>
          <button type="button" class="search-browse" id="search-browse" title="Browse"><i data-icon="browse"></i></button>
        </form>
      </div>
      <div class="tb-right" data-tauri-drag-region>
        <button class="update-pill" id="update-pill" hidden><i data-icon="download"></i><span>Update ready</span><em>Restart</em></button>
        <div class="health-bad" id="health-bad" hidden></div>
        <button class="tb-btn" id="nav-releases" title="New releases"><i data-icon="bell"></i><em class="nav-count new" id="rel-count"></em></button>
        <button class="tb-btn" id="nav-menu" title="Settings and more"><i data-icon="gear"></i></button>
        <button class="tb-btn tb-account" id="nav-account" title="Sign in" hidden><i data-icon="user"></i></button>
        <div class="win-controls" id="win-controls">
          <button class="win-btn" id="win-min" title="Minimize"><i data-icon="winMin"></i></button>
          <button class="win-btn" id="win-max" title="Maximize"><i data-icon="winMax"></i></button>
          <button class="win-btn close" id="win-close" title="Close"><i data-icon="x"></i></button>
        </div>
      </div>
    </header>

    <!-- Your Library -->
    <aside class="sidebar" id="sidebar">
      <div class="lib-head">
        <button class="lib-title" id="lib-collapse" title="Collapse Your Library"><i data-icon="library"></i><span>Your Library</span></button>
        <button class="icon-btn lib-plus" id="lib-create" title="Create or import"><i data-icon="plus"></i></button>
      </div>
      <nav class="lib-nav" id="nav">
        <button class="nav-item" data-view="charts" title="Charts"><i data-icon="chart"></i><span>Charts</span></button>
        <button class="nav-item" data-view="releases" title="New releases"><i data-icon="sparkle"></i><span>New releases</span></button>
        <button class="nav-item" data-view="stats" title="Your stats"><i data-icon="pulse"></i><span>Your stats</span></button>
        <button class="nav-item" data-view="history" title="Recently played"><i data-icon="clock"></i><span>Recently played</span></button>
      </nav>
      <div class="lib-chips" id="lib-chips">
        <button data-filter="playlist">Playlists</button>
        <button data-filter="artist">Artists</button>
        <button data-filter="downloaded">Downloaded</button>
      </div>
      <div class="lib-tools">
        <div class="lib-search" id="lib-search"><button class="icon-btn small" id="lib-search-btn" title="Search in Your Library"><i data-icon="search"></i></button><input id="lib-search-input" placeholder="Search in Your Library" spellcheck="false" /></div>
        <button class="lib-sort" id="lib-sort"><span id="lib-sort-label">Recents</span><i data-icon="list"></i></button>
      </div>
      <div class="lib-list" id="lib-list"></div>
      <div id="plugin-nav" class="plugin-nav"></div>
      <div class="tool-status" hidden>
        <div class="health" id="health" title="yt-dlp"><span class="dot"></span><span class="health-text">yt-dlp…</span></div>
        <div class="health" id="health-spotdl" title="spotDL"><span class="dot"></span><span class="health-text">spotDL…</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="views">
        <section class="view active" id="view-home"><div id="home-body"></div></section>
        <section class="view" id="view-mix"><div id="mix-body"></div></section>
        <section class="view" id="view-stats"><div id="stats-body"></div></section>
        <section class="view" id="view-playlist"><div id="playlist-detail"></div></section>
        <section class="view" id="view-favorites"><div id="fav-body"></div></section>
        <section class="view" id="view-mood"><div id="mood-body"></div></section>
        <section class="view" id="view-profile"><div id="profile-body"></div></section>
        <section class="view" id="view-search">
          <div id="search-home"></div>
          <div id="search-body" hidden>
            <div class="search-chips" id="search-chips">
              <button data-tab="all" class="active">All</button>
              <button data-tab="songs">Songs</button>
              <button data-tab="artists">Artists</button>
              <button data-tab="albums">Albums</button>
              <button data-tab="playlists">Playlists</button>
            </div>
            <div id="search-all"></div>
            <div id="search-songs" hidden>
              <div class="page-head songs-head">
                <div class="segmented" id="source-select" role="radiogroup" aria-label="Source">
                  <button data-source="all" class="active" title="All sources">All sources</button>
                  <button data-source="ytmusic" title="YouTube Music"><span class="src-ico" data-brand="ytmusic"></span><span class="src-label">YT Music</span></button>
                  <button data-source="soundcloud" title="SoundCloud"><span class="src-ico" data-brand="soundcloud"></span><span class="src-label">SoundCloud</span></button>
                  <button data-source="youtube" title="YouTube"><span class="src-ico" data-brand="youtube"></span><span class="src-label">YouTube</span></button>
                  <button data-source="spotify" title="Spotify"><span class="src-ico" data-brand="spotify"></span><span class="src-label">Spotify</span></button>
                  <button data-source="local" title="Local files" id="source-local" hidden><span class="src-ico"><i data-icon="folder"></i></span><span class="src-label">Local</span></button>
                </div>
                <span class="meta" id="search-meta"></span>
              </div>
              <div id="search-warnings"></div>
              <div class="table-head" id="results-head" hidden></div>
              <div class="track-list" id="search-results" role="listbox" aria-label="Songs"></div>
            </div>
            <div id="search-grid" hidden></div>
            <h1 id="search-title" hidden></h1>
          </div>
        </section>

        <section class="view" id="view-history">
          <div class="page-head">
            <h1>Recently played</h1>
            <div class="actions"><button class="btn" id="history-clear"><i data-icon="trash"></i>Clear</button></div>
          </div>
          <div class="table-head" id="history-head"></div>
          <div class="track-list" id="history-list" role="listbox" aria-label="Songs"></div>
        </section>

        <section class="view" id="view-themes">
          <div class="page-head">
            <h1>Themes</h1>
            <div class="actions">
              <label class="btn"><i data-icon="upload"></i>Import<input type="file" id="theme-import-file" accept=".json,application/json" hidden /></label>
              <button class="btn" id="theme-import-paste"><i data-icon="clipboard"></i>Paste JSON</button>
              <button class="btn primary" id="theme-gallery"><i data-icon="browse"></i>Gallery</button>
            </div>
          </div>
          <div class="theme-grid" id="theme-grid"></div>
          <div id="theme-editor"></div>
        </section>

        <section class="view" id="view-plugins">
          <div class="page-head">
            <h1>Plugins</h1>
            <div class="actions"><button class="btn" id="plugins-reload"><i data-icon="refresh"></i>Reload</button><button class="btn primary" id="plugin-gallery"><i data-icon="browse"></i>Gallery</button></div>
          </div>
          <p class="meta" id="plugins-dir"></p>
          <div id="plugin-list" class="plugin-list"></div>
        </section>

        <section class="view" id="view-settings">
          <div class="page-head"><h1>Settings</h1></div>
          <div class="settings" id="settings-body"></div>
        </section>

        <section class="view" id="view-charts"><div id="charts-body"></div></section>
        <section class="view" id="view-releases"><div id="releases-body"></div></section>
        <section class="view" id="view-artist"><div id="artist-body"></div></section>
        <section class="view" id="view-album"><div id="album-body"></div></section>

        <section class="view" id="view-downloads">
          <div class="page-head">
            <div><h1>Downloads</h1><span class="meta" id="dl-meta"></span></div>
            <div class="actions">
              <button class="btn primary" id="dl-play"><i data-icon="play"></i>Play all</button>
              <button class="btn" id="dl-folder" title="Change download folder"><i data-icon="folder"></i>Folder</button>
            </div>
          </div>
          <p class="meta" id="dl-dir"></p>
          <div id="dl-active"></div>
          <div class="table-head" id="dl-head" hidden></div>
          <div class="track-list" id="dl-list" role="listbox" aria-label="Songs"></div>
        </section>

        <section class="view" id="view-local">
          <div class="page-head">
            <div><h1>Local files</h1><span class="meta" id="local-meta"></span></div>
            <div class="actions">
              <button class="btn primary" id="local-play"><i data-icon="play"></i>Play all</button>
              <button class="btn" id="local-add"><i data-icon="plus"></i>Add folder</button>
              <button class="btn" id="local-rescan"><i data-icon="refresh"></i>Rescan</button>
            </div>
          </div>
          <div class="folder-list" id="local-folders"></div>
          <input class="input local-filter" id="local-filter" type="text" placeholder="Filter" spellcheck="false" />
          <div class="table-head" id="local-head" hidden></div>
          <div class="track-list" id="local-list" role="listbox" aria-label="Songs"></div>
        </section>

        <section class="view" id="view-plugin-panel">
          <div class="page-head"><h1 id="plugin-panel-title"></h1></div>
          <div id="plugin-panel-body" class="plugin-panel"></div>
        </section>
      </div>
      <div class="selection-bar" id="selection-bar" hidden></div>
    </main>

    <!-- Right panel: Now playing, queue, lyrics -->
    <aside class="queue" id="queue">
      <div class="queue-head">
        <div class="panel-tabs" role="tablist">
          <button data-panel="now" role="tab" aria-controls="np-panel">Playing</button>
          <button class="active" data-panel="queue" role="tab" aria-controls="queue-list">Queue <span class="meta" id="queue-count"></span></button>
          <button data-panel="lyrics" role="tab" aria-controls="lyrics-panel">Lyrics</button>
          <button data-panel="friends" role="tab" aria-controls="friends-panel" class="cloud-only" hidden>Friends</button>
          <button data-panel="together" role="tab" aria-controls="together-panel" class="cloud-only" hidden>Together</button>
        </div>
        <div class="actions" id="lyrics-actions" hidden>
          <button class="icon-btn" id="lyrics-full" title="Full screen lyrics"><i data-icon="expand"></i></button>
        </div>
        <div class="actions" id="queue-actions">
          <button class="icon-btn" id="queue-save" title="Save as playlist"><i data-icon="save"></i></button>
          <button class="icon-btn" id="queue-clear" title="Clear (keeps current track)"><i data-icon="trash"></i></button>
        </div>
        <button class="icon-btn" id="panel-close" title="Close"><i data-icon="x"></i></button>
      </div>
      <div class="np-panel" id="np-panel" role="tabpanel" hidden></div>
      <div class="queue-list" id="queue-list" role="tabpanel"></div>
      <div class="lyrics" id="lyrics-panel" role="tabpanel" hidden></div>
      <div class="side-panel" id="friends-panel" role="tabpanel" hidden></div>
      <div class="side-panel" id="together-panel" role="tabpanel" hidden></div>
    </aside>

    <footer class="player-bar" id="player-bar">
      <div class="now">
        <button class="cover" id="np-cover" title="Now playing"></button>
        <div class="now-text">
          <div class="np-title" id="np-title">Not playing</div>
          <button class="np-artist" id="np-artist" title="Go to artist"></button>
          <div class="np-via" id="np-via"></div>
        </div>
        <button class="icon-btn like" id="np-like" title="Like (L)"><i data-icon="heart"></i></button>
      </div>
      <div class="transport">
        <div class="buttons">
          <button class="icon-btn" id="btn-shuffle" title="Shuffle (S)"><i data-icon="shuffle"></i></button>
          <button class="icon-btn" id="btn-prev" title="Previous (P)"><i data-icon="prev"></i></button>
          <button class="play-btn" id="btn-play" title="Play / pause (Space)"><i data-icon="play"></i></button>
          <button class="icon-btn" id="btn-next" title="Next (N)"><i data-icon="next"></i></button>
          <button class="icon-btn" id="btn-repeat" title="Repeat: off"><i data-icon="repeat"></i></button>
        </div>
        <div class="progress-row">
          <span class="time" id="t-pos">0:00</span>
          <div class="progress" id="progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00 of 0:00" tabindex="0">
            <div class="track-bg"></div>
            <div class="buffered" id="p-buffered"></div>
            <div class="played" id="p-played"></div>
            <div class="knob-wrap" id="p-knobwrap"><div class="knob" id="p-knob"></div></div>
            <div class="hover-time" id="p-hover"></div>
          </div>
          <span class="time" id="t-dur">0:00</span>
        </div>
      </div>
      <div class="side-controls">
        <div id="plugin-player-slot" class="plugin-player-slot"></div>
        <button class="icon-btn" id="btn-np" title="Now playing view"><i data-icon="npView"></i></button>
        <button class="icon-btn" id="btn-lyrics" title="Lyrics"><i data-icon="mic"></i></button>
        <button class="icon-btn" id="toggle-queue" title="Queue (Q)"><i data-icon="queue"></i></button>
        <button class="icon-btn" id="btn-jam" title="Listen together" hidden><i data-icon="friends"></i></button>
        <button class="icon-btn" id="btn-device" title="Output device"><i data-icon="speaker"></i></button>
        <button class="icon-btn" id="btn-sleep" title="Sleep timer"><i data-icon="moon"></i></button>
        <button class="icon-btn" id="btn-mute" title="Mute (M)"><i data-icon="volume"></i></button>
        <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume" />
        <button class="icon-btn" id="btn-full" title="Full screen"><i data-icon="expand"></i></button>
        <button class="icon-btn" id="btn-more" title="More controls" aria-haspopup="menu"><i data-icon="dots"></i></button>
      </div>
    </footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="brands.js"></script>
  <script src="js/core.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/search.js"></script>
  <script src="js/player.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/library.js"></script>
  <script src="js/artist.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/foryou.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/social.js"></script>
  <script src="js/update.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
