# Builds, signs and publishes a release whenever a tag like v0.2.0 is pushed.
# The release includes latest.json, which the in-app updater reads.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/tunewire.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - platform: windows-latest
            args: "--bundles nsis,msi"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev pkg-config cmake

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      - name: Offline tests
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo test

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          notes=$(awk -v tag="## ${GITHUB_REF_NAME}" '$0==tag {on=1; next} /^## / {on=0} on' CHANGELOG.md | sed '/./,$!d')
          {
            echo 'body<<EOF_NOTES'
            echo "${notes:-See the commits for this release.}"
            echo
            echo '**Windows:** the -setup.exe installer updates itself; .msi is also available.'
            echo '**Linux:** the .AppImage updates itself; .deb and .rpm are also available.'
            echo 'Tunewire needs yt-dlp; if it is missing, the app offers to install its own copy.'
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Tunewire ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
