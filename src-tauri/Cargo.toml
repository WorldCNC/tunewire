[package]
name = "tunewire"
version = "1.0.4"
description = "Native multi-source music player (SoundCloud / YouTube Music / Spotify via yt-dlp)"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tunewire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# Plain `cargo build`/`cargo run` embed the frontend; `cargo tauri dev`
# disables default features and loads the live dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
ureq = "3.4"
strsim = "0.11"
thiserror = "2"
discord-rich-presence = "1.1"
symphonia-adapter-libopus = "=0.2.3"
symphonia = { version = "0.5.5", default-features = false, features = ["mkv", "ogg", "isomp4", "aac", "mp3", "flac", "vorbis", "pcm", "wav"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
lofty = "0.22"
sha2 = "0.10"
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-audio = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mimalloc = { version = "0.1", default-features = false }
getrandom = "0.2"
open = "5"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# librespot-core with one change: it calls process::exit(1) for non-Premium
# accounts, which would kill Tunewire. See vendor/librespot-core/src/session.rs.
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
