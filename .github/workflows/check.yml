# Every push and pull request: build and test on Windows, Linux and macOS
# (the platforms releases ship for), check formatting and lint the Rust code,
# check the frontend scripts (they parse, no clashing global names), test
# the sync operations and the Edge Functions, run the database migrations
# plus their row level security tests on a real Postgres, and run library
# sync end to end on a local Supabase.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build
        working-directory: src-tauri
        run: cargo build --locked
      - name: Offline tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Formatting
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Frontend scripts parse
        run: deno run --allow-read scripts/check-frontend.ts
      - name: Playlist sync arithmetic
        run: deno test --allow-read scripts/syncops_test.ts
      - name: Edge Functions
        run: |
          deno check supabase/functions/report/index.ts supabase/functions/share/index.ts
          deno test supabase/functions
      - name: Gallery index is up to date
        run: |
          python3 scripts/build-gallery.py
          git diff --exit-code gallery/index.json

  database:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and row level security tests
        run: scripts/test-db.sh

  # Two devices, one account, a local Supabase: library sync end to end.
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Library sync, end to end
        run: scripts/test-sync.sh
